# IBK 규제변동 영향분석 PoC — docker-compose 스니펫
#
# 사용:
#   docker compose -f docker-compose.poc.yml up -d        (단독 실행)
#   또는 기존 사내 compose에 'compliance-poc' 서비스로 병합
#
# 폐쇄망: 먼저 이미지를 반입(README 참조)한 뒤 build 대신 image 사용.
services:
  compliance-poc:
    build:
      context: .
      dockerfile: Dockerfile
    image: ibk-compliance-poc:latest
    container_name: ibk-compliance-poc
    restart: unless-stopped
    env_file:
      - .env.docker # 비밀값/엔드포인트 (.env.docker.example 참고하여 생성)
    ports:
      - "4000:4000"
    networks:
      - backend # core-ai·qdrant·opensearch 등이 있는 사내 네트워크
    # PDF 고품질 파싱: .env.docker 에 PDF_PARSER=docling, ROOKIE_PARSER_URL=http://doc-ai:8900 (권장)
    #   docling 사용 시 아래 depends_on 주석 해제(모델 준비 전 요청 차단). 미사용(kordoc 기본)이면 불요.
    # depends_on:
    #   doc-ai:
    #     condition: service_healthy

  # PDF 파싱 사이드카(권장, 순수 Python Docling — Java 없음). rookie-parser 대체. PDF만 위임(HWP는 앱 내 kordoc).
  doc-ai:
    build:
      context: ./services/doc-ai
      dockerfile: Dockerfile
    image: ibk-doc-ai:latest
    container_name: ibk-doc-ai
    restart: unless-stopped
    expose:
      - "8900"
    environment:
      # 사이드카가 스캔/손상 페이지를 직접 OCR(3단계)할 때 쓰는 DGX VLM(Node dgxSparkUrl 정합)
      - DOCAI_DGX_URL=${DGX_SPARK_URL:-http://172.23.80.102:8000}
      - DOCAI_DGX_MODEL=${DGX_SPARK_MODEL:-google/gemma-4-26B-A4B-it}
    networks:
      - backend
    healthcheck: # /health 는 Docling 모델 프리로드 완료 후에만 200(설계 §8-2 — G1)
      test: ["CMD", "python", "-c", "import urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://localhost:8900/health',timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s # 모델 워밍업 여유

  # 레거시 PDF 사이드카(ODL Java CLI) — docling 으로 대체됨. PDF_PARSER=rookie 호환용으로만 잔존.
  rookie-parser:
    build:
      context: ./services/rookie-parser
      dockerfile: Dockerfile
    image: ibk-rookie-parser:latest
    container_name: ibk-rookie-parser
    restart: unless-stopped
    expose:
      - "8900"
    networks:
      - backend

# 사내 백엔드가 떠 있는 기존 네트워크에 연결(이름은 환경에 맞게 수정).
# 기존 compose에 병합 시 이 networks 블록은 환경의 정의를 따른다.
networks:
  backend:
    external: true
    name: law-ai_default # ← 실제 사내 네트워크명으로 교체
